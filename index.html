  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Night Drip</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #1a1d23;
        margin: 0;
        font-family: 'Inter', sans-serif;
        overflow: hidden;
      }
      /* Custom Scrollbar for Phone Mode */
      .phone-scroll::-webkit-scrollbar {
        width: 4px;
      }
      .phone-scroll::-webkit-scrollbar-track {
        background: transparent;
      }
      .phone-scroll::-webkit-scrollbar-thumb {
        background: #4fd1c5;
        border-radius: 2px;
      }
      /* Character Sprite Blending for "Transparent" effect on dark BGs */
      .sprite-blend {
        mix-blend-mode: multiply;
        filter: contrast(1.1) brightness(1.1);
      }
      .scanline {
        background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
        background-size: 100% 4px;
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        pointer-events: none;
        z-index: 50;
        opacity: 0.3;
      }
    </style>
